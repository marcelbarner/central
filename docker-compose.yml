services:
  postgres:
    image: postgres:17-alpine
    container_name: central-postgres
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central_password_change_me
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - central-network

  central-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: central-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__centraldb=Host=postgres;Port=5432;Database=central;Username=central;Password=central_password_change_me
      - FileSystem__Media=/app/media
    volumes:
      - media-data:/app/media
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - central-network

volumes:
  postgres-data:
    driver: local
  media-data:
    driver: local

networks:
  central-network:
    driver: bridge
